<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 982" width="420" height="982" role="img" aria-label="Data flow: on the phone, a still phone's accelerometer is filtered to below 25 Hz and reduced to averaged spectra in a session file. On the server, sessions are stacked per building, modes are identified and non-structural peaks rejected. The result feeds a vulnerability model, a score with a band, and an API and dashboard.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#111111}.mute{fill:#5F5F5F}.acc{fill:#000000}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="420" height="982" rx="3" fill="#F5F5F5"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E8E8E8" stroke-width="1"/></pattern></defs>
<rect width="420" height="982" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M396 14H406V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M24 968H14V958" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M396 968H406V958" fill="none" stroke="#5F5F5F" stroke-width="1"/>
<text x="30" y="56" class="m" font-size="11"><tspan class="acc">A</tspan><tspan class="mute" dx="10">On the phone</tspan></text><rect x="30" y="72" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.00s" cx="48" cy="94" r="3.2" fill="#000000"/>
<text x="62" y="98" class="m ink" font-size="12" font-weight="600">Phone at rest</text>
<text x="48" y="118" class="s mute" font-size="13">3-axis accelerometer</text>
<text x="48" y="134" class="s mute" font-size="13">flat, still, on charge</text><path class="flow" d="M350 144V163" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 162l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="168" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.45s" cx="48" cy="190" r="3.2" fill="#000000"/>
<text x="62" y="194" class="m ink" font-size="12" font-weight="600">On-device DSP</text>
<text x="48" y="214" class="s mute" font-size="13">low-pass, nothing above 25 Hz</text>
<text x="48" y="230" class="s mute" font-size="13">three zoom bands to 0.1 Hz</text><path class="flow" d="M350 240V259" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 258l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="264" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.90s" cx="48" cy="286" r="3.2" fill="#000000"/>
<text x="62" y="290" class="m ink" font-size="12" font-weight="600">Session file</text>
<text x="48" y="310" class="s mute" font-size="13">averaged spectra only</text>
<text x="48" y="326" class="s mute" font-size="13">building id, no location</text><path class="flow" d="M350 336V373" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 372l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="30" y="362" class="m" font-size="11"><tspan class="acc">B</tspan><tspan class="mute" dx="10">On the server</tspan></text><rect x="30" y="378" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.35s" cx="48" cy="400" r="3.2" fill="#000000"/>
<text x="62" y="404" class="m ink" font-size="12" font-weight="600">Stack</text>
<text x="48" y="424" class="s mute" font-size="13">many nights, many phones</text>
<text x="48" y="440" class="s mute" font-size="13">per building</text><path class="flow" d="M350 450V469" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 468l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="474" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.80s" cx="48" cy="496" r="3.2" fill="#000000"/>
<text x="62" y="500" class="m ink" font-size="12" font-weight="600">Identify</text>
<text x="48" y="520" class="s mute" font-size="13">frequency, damping, shape</text>
<text x="48" y="536" class="s mute" font-size="13">five estimators + bootstrap</text><path class="flow" d="M350 546V565" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 564l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="570" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.25s" cx="48" cy="592" r="3.2" fill="#000000"/>
<text x="62" y="596" class="m ink" font-size="12" font-weight="600">Reject</text>
<text x="48" y="616" class="s mute" font-size="13">tones, HVAC, furniture</text>
<text x="48" y="632" class="s mute" font-size="13">non-structural peaks out</text><path class="flow" d="M350 642V679" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 678l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="30" y="668" class="m" font-size="11"><tspan class="acc">C</tspan><tspan class="mute" dx="10">For the reader</tspan></text><rect x="30" y="684" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.70s" cx="48" cy="706" r="3.2" fill="#000000"/>
<text x="62" y="710" class="m ink" font-size="12" font-weight="600">Vulnerability</text>
<text x="48" y="730" class="s mute" font-size="13">class prior + measured period</text>
<text x="48" y="746" class="s mute" font-size="13">Hazus 6.1 capacity spectrum</text><path class="flow" d="M350 756V775" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 774l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="780" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.15s" cx="48" cy="802" r="3.2" fill="#000000"/>
<text x="62" y="806" class="m ink" font-size="12" font-weight="600">Score</text>
<text x="48" y="826" class="s mute" font-size="13">0–100, 100 least vulnerable</text>
<text x="48" y="842" class="s mute" font-size="13">always with a 5–95% band</text><path class="flow" d="M350 852V871" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 870l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="876" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.60s" cx="48" cy="898" r="3.2" fill="#000000"/>
<text x="62" y="902" class="m ink" font-size="12" font-weight="600">API + dashboard</text>
<text x="48" y="922" class="s mute" font-size="13">FastAPI, 13 routes, SQLite</text>
<text x="48" y="938" class="s mute" font-size="13">MapLibre map, change alerts</text>
</svg>